# 4 GB is not excessive here: the CMake/NDK external build for llama_bindings and R8 both
# run inside the Gradle daemon, and 2 GB (the Flutter default) OOMs on a clean release build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
# Nothing in the dependency set is a pre-AndroidX library, so Jetifier is pure build-time cost.
android.enableJetifier=false
android.nonTransitiveRClass=true

org.gradle.parallel=true
org.gradle.caching=true

# AGP 8.5.2 was validated up to compileSdk 34. 35 is a stable API and builds fine; without
# this every Gradle invocation prints a recommendation to upgrade AGP.
android.suppressUnsupportedCompileSdk=35
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
