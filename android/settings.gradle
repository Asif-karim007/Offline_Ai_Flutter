// Declarative plugin management (Flutter 3.22+ style). The old
// `apply from: $flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle`
// form is gone; the Flutter SDK is an included build instead.

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    // AGP 8.5.1 was the first version that zip-aligns uncompressed native libraries to
    // 16 KB boundaries inside the APK. Android 15 requires that alignment, and the NDK r27
    // build only guarantees the *segment* alignment inside each .so — the packaging step
    // has to agree. Flutter 3.44 requires AGP 8.6.0 or newer and warns below 8.11.1.
    //
    // packages/llama_bindings/android/build.gradle pins the same version for standalone use;
    // that pin only applies when the plugin is built standalone. Inside an app build the
    // version resolved here is the one that runs.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
