name: offline_ai_chat
description: An offline-first AI chat app that runs a local GGUF model on-device through llama.cpp.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Bangla for the framework's own text — dialog semantics, text-field menus, date pickers.
  # The app's strings are hand-written in lib/l10n/, with no code generation.
  flutter_localizations:
    sdk: flutter

  # --- inference -----------------------------------------------------------------------
  # The local FFI plugin. Everything that knows llama.cpp exists lives behind it.
  llama_bindings:
    path: packages/llama_bindings

  # --- state ---------------------------------------------------------------------------
  # ChangeNotifier maps directly onto the Swift app's @Observable view models, one for one.
  # Deliberately not Riverpod: this port has no code generation anywhere, so a fresh clone
  # is `flutter pub get && flutter run` with no build_runner step in between.
  provider: ^6.1.2

  # --- persistence ---------------------------------------------------------------------
  # sqflite over drift for the same reason — drift needs build_runner. The schema is two
  # tables; hand-written SQL is no hardship and the migration path stays explicit.
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # --- files ---------------------------------------------------------------------------
  file_picker: ^8.1.2
  # PDFium-backed text extraction. MIT, unlike Syncfusion's revenue-capped community licence.
  pdfrx: ^1.0.87

  # --- network -------------------------------------------------------------------------
  # Only reachable when web search is explicitly enabled. Nothing in the generation path
  # makes a network call.
  http: ^1.2.2

  # --- misc ----------------------------------------------------------------------------
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  gpt_markdown: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device evaluation runs (integration_test/), with the real engine and model.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Runs the curriculum index's real SQLite/FTS4 queries on the host in tests.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    # A bundled GGUF goes here and is copied into application support on first launch.
    # The repository does not ship one — see README section "Model resource setup".
    - assets/models/

# Only `sqflite_common_ffi` (a dev dependency, for tests) pulls in `package:sqlite3`. Its
# bundled SQLite is built without FTS4, which the curriculum index needs; the system SQLite
# has it, exactly as Android's and iOS's — which sqflite uses on device — do.
hooks:
  user_defines:
    sqlite3:
      source: system
